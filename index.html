<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#6D28D9"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ErrandCo"><link rel="apple-touch-icon" href="./icons/icon-180.png"><link rel="icon" href="./icons/icon-192.png">
<title>ErrandCo Prototype</title>
<script>/* ===== BRAND CONFIG — change here ===== */
/* Accent options shown in the switcher (first = default). All pass WCAG AA with white text. */
const ACCENTS=[{id:'indigo',name:'Electric indigo',hex:'#5B3FD9'},{id:'cobalt',name:'Cobalt',hex:'#1D4ED8'},{id:'violet',name:'Deep violet',hex:'#6D28D9'}];
const BRAND={name:'ErrandCo',plus:'ErrandCo+',accent:'#6D28D9',onAccent:'#fff',ink:'#000',bg:'#fff'};</script>
<style>
:root{--accent:#6D28D9;--on-accent:#fff;--ink:#000;--bg:#fff;--soft:#F3F3F3;--muted:#6B6B6B;--line:#E8E8E8;--warn:#FFF4D6}
*{box-sizing:border-box}body{margin:0;font-family:"Uber Move","Helvetica Neue",Inter,Arial,sans-serif;background:#E9E9E9;color:var(--ink)}
.top{position:sticky;top:0;z-index:50;background:#000;color:#fff;display:flex;align-items:center;gap:6px;padding:8px 12px}
.sw{display:flex;align-items:center;gap:6px;background:#1a1a1a;border-radius:20px;padding:4px 10px;margin-right:auto;font-size:12px;font-weight:600}.top .sw button{width:22px;height:22px;padding:0;flex:none;border-radius:50%;border:2px solid #000;cursor:pointer}.top .sw button.cur{outline:2px solid #fff}
.top{flex-wrap:wrap}.top b{margin-right:8px;font-weight:800;letter-spacing:-.3px}.top button{background:#222;color:#fff;border:0;padding:8px 14px;border-radius:20px;cursor:pointer;font-weight:600}
.top button.on{background:#fff;color:#000}
.phone{position:relative;max-width:400px;height:820px;margin:14px auto;background:var(--bg);border-radius:32px;box-shadow:0 10px 30px #0003;overflow:hidden;display:flex;flex-direction:column}
.full{position:absolute;inset:0}.full svg{width:100%;height:100%}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -6px 24px #0002;padding:10px 16px 16px;max-height:72%;overflow:auto;z-index:5}
.sheet.tall{max-height:86%}.grab{width:40px;height:5px;border-radius:3px;background:#ccc;margin:0 auto 10px}
.page{flex:1;overflow:auto;padding:16px;padding-bottom:70px}
h1{font-size:28px;font-weight:800;letter-spacing:-.5px;margin:6px 0 12px}h3{font-size:18px;font-weight:800;margin:14px 0 8px}
.where{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:30px;padding:14px 16px;font-size:20px;font-weight:700;cursor:pointer}
.where .sq{width:10px;height:10px;background:var(--accent)}
.btn{display:block;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:16px;width:100%;font-size:17px;font-weight:700;cursor:pointer;margin-top:8px}
.btn.a{background:var(--accent);color:var(--on-accent)}.btn.o{background:var(--soft);color:#000}.btn.sm{padding:10px;font-size:14px;width:auto;display:inline-block}
.go{width:110px;height:110px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:30px;font-weight:900;border:6px solid #fff;box-shadow:0 6px 20px #0004;cursor:pointer}
input,select{width:100%;padding:12px;border:0;background:var(--soft);border-radius:8px;margin:4px 0;font:inherit;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.muted{color:var(--muted);font-size:13px}
.chip{display:inline-block;padding:8px 12px;border-radius:18px;background:var(--soft);color:#000;margin:3px;font-size:13px;font-weight:600;cursor:pointer;border:0}
.chip.on{background:var(--accent);color:var(--on-accent)}
.tag{font-size:11px;padding:2px 8px;border-radius:4px;background:var(--soft);font-weight:700}.tag.a{background:var(--accent);color:var(--on-accent)}.tag.w{background:var(--warn)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.li .ic{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:18px;flex:none}
.opt{display:flex;align-items:center;gap:12px;padding:12px;border:2px solid transparent;border-radius:12px;cursor:pointer}.opt.on{border-color:var(--ink)}
.opt .p{margin-left:auto;font-weight:800}
.stop{border-left:3px solid var(--line);padding-left:12px;margin:8px 0}.stop.d{border-color:var(--accent)}
.nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);z-index:10}
.nav button{flex:1;background:none;border:0;padding:10px 2px;font-size:11px;color:var(--muted);cursor:pointer;font-weight:600}.nav button.on{color:#000;font-weight:800;box-shadow:inset 0 3px var(--accent)}
.bubble{padding:10px 14px;border-radius:18px;margin:4px 0;max-width:80%}.me{background:#000;color:#fff;margin-left:auto}.them{background:var(--soft)}
.chk{display:flex;gap:8px;align-items:center;margin:6px 0}.chk input{width:auto}
.turn{background:#000;color:#fff;padding:14px 16px;display:flex;gap:12px;align-items:center;z-index:6;position:absolute;top:0;left:0;right:0}.turn .ar{font-size:28px;background:var(--accent);color:var(--on-accent);width:48px;height:48px;border-radius:10px;display:grid;place-items:center;flex:none}
.pulse{width:120px;height:120px;border-radius:50%;background:var(--accent);opacity:.25;margin:20px auto;animation:p 1.4s infinite}@keyframes p{0%{transform:scale(.5);opacity:.5}100%{transform:scale(1.3);opacity:0}}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.stars span{font-size:34px;cursor:pointer;color:#ccc}.stars span.on{color:#000}
.wide{max-width:1200px;margin:14px auto;padding:0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.kpi{font-size:30px;font-weight:800;letter-spacing:-.5px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:var(--muted);text-transform:uppercase}
.fab{position:absolute;top:14px;left:14px;z-index:6;background:#fff;border-radius:50%;width:42px;height:42px;border:0;box-shadow:0 2px 8px #0003;font-size:18px;cursor:pointer}
#mm{display:none}
@media (max-width:600px){body{background:#fff}#mm{display:block;position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:10px;z-index:100;width:40px;height:40px;border-radius:50%;border:0;background:#000c;color:#fff;font-size:18px}
.top{display:none;position:fixed;top:calc(env(safe-area-inset-top) + 56px);right:10px;left:10px;border-radius:14px;z-index:99;box-shadow:0 8px 24px #0006}body.mopen .top{display:flex}
.phone{max-width:none;height:100vh;height:100dvh;margin:0;border-radius:0;box-shadow:none;padding-top:env(safe-area-inset-top)}.nav{padding-bottom:env(safe-area-inset-bottom)}.wide{margin:0;padding:calc(env(safe-area-inset-top) + 8px) 12px 12px}}
</style></head><body><button id="mm" aria-label="Prototype menu">☰</button>
<div class="top"><b id="brandTop"></b><div class="sw" id="sw" aria-label="Accent color switcher"><span>Accent:</span><span id="swName"></span></div><button data-v="c" class="on">Customer</button><button data-v="r">Runner</button><button data-v="a">Owner</button></div>
<div id="app"></div>
<script>
document.documentElement.style.setProperty('--accent',BRAND.accent);document.documentElement.style.setProperty('--on-accent',BRAND.onAccent);
document.documentElement.style.setProperty('--ink',BRAND.ink);document.documentElement.style.setProperty('--bg',BRAND.bg);
document.title=BRAND.name+' Prototype';document.getElementById('brandTop').textContent=BRAND.name+' · Prototype';
const $=s=>document.querySelector(s);
const S={view:'c',ct:'home',rt:'jobs',at:'live',stops:[
 {type:'Groceries',place:'Stop & Shop, Great Neck',items:[['Milk 1 gal',4.49],['Eggs dozen',3.99],['Bananas',1.89]],note:''},
 {type:'Personal pickup',place:'Grandma — 12 Elm St',items:[['Blue casserole dish (porch)',0]],note:'Under the bench'},
 {type:'Drop-off',place:'Sister — 88 Middle Neck Rd',items:[['Casserole dish',0]],note:'Leave with doorman'}],
 member:false,priority:'standard',trackStep:1,chat:[['them','Hi! I\'m Maya, heading to Stop & Shop now 🙂']],cap:null,tip:3,rating:0,
 accepted:false,rstop:0,done:{},pay:{base:6,perStop:3.5,perMile:1.2,servicePct:8,memberDisc:20,runnerShare:80,capPad:15},online:false,offerT:30,passed:0};
const types={'Groceries':'🛒','Dry cleaning':'👔','Returns':'↩️','Post office':'📮','Pharmacy':'💊','Personal pickup':'🏠','Drop-off':'📦','Custom task':'✨'};
const money=n=>'$'+n.toFixed(2);const B=BRAND.name;
function price(){const p=S.pay;const goods=S.stops.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i[1],0),0);
 const buffer=goods*p.capPad/100;const miles=2+S.stops.length*1.1;let fee=p.base+p.perStop*S.stops.length+p.perMile*miles;
 if(S.priority==='rush')fee*=1.35;if(S.member)fee*=(1-p.memberDisc/100);const svc=fee*p.servicePct/100;
 const suggested=Math.ceil((goods+buffer)/5)*5;const cap=S.cap==null?suggested:S.cap;
 return{goods,buffer,fee,svc,service:fee+svc,miles,cap,suggested,total:fee+svc+cap,refund:Math.max(0,cap-goods),saved:S.stops.length*7.5}}
function mapSvg(n=3,runner=true,prog=0){const pts=[[60,330],[150,190],[290,280],[330,120],[200,80],[100,90]].slice(0,n+1);const A='var(--accent)';
 const rp=pts[Math.min(Math.max(prog,1),pts.length-1)]||pts[1];
 return `<svg viewBox="0 0 400 560" preserveAspectRatio="xMidYMid slice"><rect width="400" height="560" fill="#EEEEEC"/>
 <g stroke="#fff" stroke-width="10"><path d="M0 140H400M0 300H400M0 450H400M90 0V560M240 0V560M350 0V560"/><path d="M0 40L400 520" stroke-width="14"/></g>
 <rect x="110" y="320" width="100" height="90" fill="#DDEBD8"/><rect x="260" y="160" width="70" height="60" fill="#DDEBD8"/>
 <polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" style="stroke:var(--accent)" stroke-opacity=".35" stroke-width="5" stroke-dasharray="10 6"/>
 <polyline points="${pts.slice(0,Math.max(prog,0)+1).map(p=>p.join(',')).join(' ')}" fill="none" style="stroke:${A}" stroke-width="6"/>
 ${pts.map((p,i)=>i?`<rect x="${p[0]-9}" y="${p[1]-9}" width="18" height="18" rx="3" style="fill:var(--accent)"/><text x="${p[0]-4}" y="${p[1]+5}" style="fill:var(--on-accent)" font-size="12" font-weight="700">${i}</text>`:`<circle cx="${p[0]}" cy="${p[1]}" r="9" fill="#000"/><circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#fff"/>`).join('')}
 ${runner?`<g transform="translate(${rp[0]-14},${rp[1]-40})"><rect width="28" height="16" rx="4" style="fill:${A}" stroke="#fff" stroke-width="3"/><circle cx="14" cy="8" r="3" style="fill:var(--on-accent)"/></g>`:''}</svg>`}
const nav=(tabs,cur,key)=>`<div class="nav">${tabs.map(t=>`<button class="${t[0]==cur?'on':''}" onclick="S.${key}='${t[0]}';R()">${t[1]}</button>`).join('')}</div>`;
/* ===== CUSTOMER ===== */
const CN=[['home','Home'],['track','Activity'],['chat','Chat'],['hist','History'],['plus','Plus']];
function customer(){const p=price();let inner='';const map=(n,r,pr)=>`<div class="full">${mapSvg(n,r,pr)}</div>`;
if(S.ct=='home'){inner=`${map(S.stops.length,false)}<div class="sheet"><div class="grab"></div>
<div class="where" onclick="S.ct='stops';R()"><span class="sq"></span>Where to?</div>
<div class="muted" style="margin:10px 0 4px">One booking · any mix of stores & people · one upfront price · ${7} runners nearby</div>
${Object.keys(types).map(t=>`<button class="chip" onclick="addStop('${t}');S.ct='stops';R()">${types[t]} ${t}</button>`).join('')}
<div class="li" onclick="S.ct='plus';R()" style="cursor:pointer"><div class="ic">🗓</div><div><b>Saturday Run</b><div class="muted">Standing errand · 10am</div></div></div>
<div class="li" onclick="S.ct='stops';R()" style="cursor:pointer"><div class="ic">🕘</div><div><b>Your current trip · ${S.stops.length} stops</b><div class="muted">${S.stops.map(s=>s.place.split(',')[0]).join(' → ')}</div></div></div></div>`}
if(S.ct=='stops'){inner=`<div class="page"><button class="chip" onclick="S.ct='home';R()">←</button><h1>Your stops</h1>
${S.stops.map((s,i)=>`<div class="card"><div class="row"><b>${types[s.type]} ${i+1}. ${s.type}</b><button class="chip" onclick="S.stops.splice(${i},1);R()">✕</button></div>
<input value="${s.place}" onchange="S.stops[${i}].place=this.value">${s.items.map(it=>`<div class="row muted"><span>• ${it[0]}</span><span>${it[1]?money(it[1]):'—'}</span></div>`).join('')}
<div class="row"><input id="it${i}" placeholder="Add item / instruction"><button class="chip" onclick="addItem(${i})">+</button></div>
${s.note?`<div class="muted">📝 ${s.note}</div>`:''}</div>`).join('')}
<div class="muted">+ Add stop</div>${Object.keys(types).map(t=>`<button class="chip" onclick="addStop('${t}')">${types[t]} ${t}</button>`).join('')}
<button class="btn" onclick="S.ct='opts';R()">Done</button></div>`}
if(S.ct=='opts'){const o=[['standard','🚗','Standard','~90 min'],['rush','⚡','Rush','~45 min'],['schedule','🗓','Schedule later','Pick a time']];
inner=`${map(S.stops.length,false)}<button class="fab" onclick="S.ct='stops';R()">←</button><div class="sheet tall"><div class="grab"></div><h3 style="margin-top:0">Choose a trip</h3>
${o.map(x=>{const sv=S.priority;S.priority=x[0];const q=price();S.priority=sv;return `<div class="opt ${S.priority==x[0]?'on':''}" onclick="S.priority='${x[0]}';R()"><span style="font-size:26px">${x[1]}</span><div><b>${x[2]}</b><div class="muted">${x[3]} · ${S.stops.length} stops</div></div><span class="p">${money(q.total)}</span></div>`}).join('')}
<div class="row" style="margin-top:8px"><span><b>Spending cap</b> <span class="muted">for store purchases</span></span><input type="number" id="cap" style="width:100px" value="${p.cap}" onchange="S.cap=+this.value;R()"></div>
<div class="muted">Suggested ${money(p.suggested)} (items ${money(p.goods)} + ${S.pay.capPad}% price buffer). Unused cap refunded with receipts; anything over needs your OK in chat.</div>
<div class="muted" style="margin-top:6px">Substitutions: ask me in chat first · Alcohol/Rx: ID verified at handoff</div>
<div class="row" style="margin-top:8px"><span>💳 Apple Pay ••4242</span><span class="muted">Change</span></div>
<button class="btn" onclick="S.ct='price';R()">Review price</button></div>`}
if(S.ct=='price'){inner=`<div class="page"><button class="chip" onclick="S.ct='opts';R()">←</button><h1>${money(p.total)}</h1><div class="muted" style="margin-top:-8px">One upfront price · locked in</div>
<div class="card" style="margin-top:12px"><div class="row"><span>Service fee · ${S.stops.length} stops · ${p.miles.toFixed(1)} mi ${S.priority=='rush'?'· Rush':''}</span><b>${money(p.fee)}</b></div>
<div class="row"><span>Platform</span><b>${money(p.svc)}</b></div><div class="row"><b>Locked service fee</b><b>${money(p.service)}</b></div>
${S.member?`<div><span class="tag a">${BRAND.plus} discount applied</span></div>`:''}<hr style="border:0;border-top:1px solid var(--line)">
<div class="row"><span>Purchase spending cap</span><b>${money(p.cap)}</b></div>
<div class="row muted"><span>Store items at shelf price</span><span>${money(p.goods)}</span></div>
<div class="row muted"><span>Est. refund if unused (with receipts)</span><span>${money(p.refund)}</span></div></div>
<div class="muted">You'll never pay more than this unless you approve an overage in chat. Tip is optional and 100% goes to your runner.</div>
<div class="card" style="margin-top:10px;border-color:var(--accent)">⏱ Est. ${S.stops.length*25} min saved vs. separate trips (≈${money(p.saved)} in separate delivery fees)</div>
<button class="btn a" onclick="S.ct='match';S.trackStep=1;R();setTimeout(()=>{if(S.ct=='match'){S.ct='track';R()}},2500)">Confirm ${S.priority=='rush'?'Rush':'Standard'} · ${money(p.total)}</button>
<button class="btn o" onclick="S.ct='stops';R()">Edit stops</button></div>`}
if(S.ct=='match'){inner=`${map(S.stops.length,false)}<div class="sheet"><div class="grab"></div><h3 style="margin-top:0">Matching your runner…</h3><div class="bar"><i style="width:60%"></i></div><div class="pulse"></div>
<div class="muted" style="text-align:center">Finding a background-checked runner near ${S.stops[0]?.place||'you'}</div><button class="btn o" onclick="S.ct='track';R()">Skip wait (demo)</button><button class="btn o" onclick="S.ct='price';R()">Cancel</button></div>`}
if(S.ct=='track'){const steps=['Runner assigned','At stop 1','At stop 2','At stop 3','Delivered'];const eta=Math.max(5,60-S.trackStep*15);
inner=`${map(S.stops.length,true,S.trackStep)}<div class="sheet tall"><div class="grab"></div><div class="row"><h3 style="margin:0">${S.trackStep>=4?'Delivered':steps[Math.min(S.trackStep,4)]}</h3><span class="tag a">${S.trackStep>=4?'Done':eta+' min'}</span></div>
<div class="li"><div class="ic">👩</div><div style="flex:1"><b>Maya R.</b> ★ 4.97 · Pro Runner <span class="tag">Employee</span><div class="muted">Silver Prius · ETA ${eta} min</div></div><button class="chip" onclick="S.ct='chat';R()">💬</button></div>
${S.stops.map((s,i)=>{const d=i+1<S.trackStep;return `<div class="stop ${d?'d':''}"><b>${d?'✓':'○'} ${s.place}</b><div class="muted">${d?'Done · 📷 photo proof · receipt '+money(s.items.reduce((a,x)=>a+x[1],0)):s.type}</div></div>`}).join('')}
${S.trackStep>=4?`<button class="btn a" onclick="S.ct='rate';R()">Rate & tip</button>`:`<button class="btn" onclick="S.trackStep=Math.min(S.trackStep+1,4);R()">▶ Simulate progress</button>`}
<button class="btn o">📍 Share live tracking link</button></div>`}
if(S.ct=='rate'){inner=`<div class="page" style="text-align:center"><h1>How was Maya?</h1><div class="muted">${S.stops.length} stops · ${money(p.service)} service · refund ${money(p.refund)} on its way with receipts</div>
<div class="stars" style="margin:16px 0">${[1,2,3,4,5].map(n=>`<span class="${n<=S.rating?'on':''}" onclick="S.rating=${n};R()">★</span>`).join('')}</div>
<h3>Add a tip</h3>${[0,3,5,8].map(t=>`<button class="chip ${S.tip==t?'on':''}" onclick="S.tip=${t};R()">$${t}</button>`).join('')}<div class="muted">100% goes to your runner</div>
<button class="btn" onclick="S.ct='hist';R()">Done</button><button class="btn o">🧾 View receipts</button></div>`}
if(S.ct=='chat'){inner=`<div class="page"><h1>Maya</h1>${S.chat.map(m=>`<div class="bubble ${m[0]}">${m[1]}</div>`).join('')}
<div class="card" style="background:var(--warn);border:0">🔄 Maya suggests: Organic milk is out — swap for Horizon 2% ($4.99)? <br><button class="chip" onclick="say('Yes swap is fine')">Approve</button><button class="chip" onclick="say('Skip it please')">Skip</button></div>
<div class="card" style="border-color:var(--accent)">💵 Over-cap request: approve +$5.00 over your spending cap? <br><button class="chip on" onclick="say('Approved +$5 over cap')">Approve</button><button class="chip" onclick="say('Please stay under cap')">Decline</button></div>
<div class="row"><input id="msg" placeholder="Message…"><button class="chip" onclick="say($('#msg').value)">Send</button></div></div>`}
if(S.ct=='hist'){inner=`<div class="page"><h1>History</h1>${[['Oct 19','4 stops · Groceries, CVS, UPS, Mom\'s','$78.40'],['Oct 12','2 stops · Dry cleaning, Post office','$24.10'],['Oct 5','5 stops · Weekly Saturday run','$112.75']].map(h=>`<div class="li"><div class="ic">🧾</div><div style="flex:1"><div class="row"><b>${h[0]}</b><b>${h[2]}</b></div><div class="muted">${h[1]}</div><button class="chip">🔁 Reorder</button><button class="chip">🧾 Receipts</button></div></div>`).join('')}</div>`}
if(S.ct=='plus'){inner=`<div class="page"><div class="card" style="background:#000;color:#fff"><h3 style="margin-top:0">${BRAND.plus} <span class="tag a" style="font-size:13px">$14.99/mo</span></h3>• ${S.pay.memberDisc}% off every service fee<br>• Free standing weekly run<br>• Priority runners & rush at no extra<br>• Same favorite runner when available</div>
<button class="btn ${S.member?'o':'a'}" onclick="S.member=!S.member;R()">${S.member?'✓ Member — manage':'Join '+BRAND.plus}</button>
<h3>Standing errands</h3><div class="card"><div class="row"><b>🗓 Saturday Run · 10am</b><span class="tag a">Active</span></div><div class="muted">Stop & Shop list · Dry cleaner drop/pick · Library returns</div><button class="chip">Edit list</button><button class="chip">Skip this week</button></div>
<div class="card"><div class="row"><b>💊 Monthly CVS refill</b><span class="tag w">Next: Nov 2</span></div></div><button class="btn o">+ New standing errand</button>
<div class="card" style="margin-top:10px">🎁 Invite a neighbor, both get $10 off</div></div>`}
return `<div class="phone">${inner}${nav(CN,S.ct,'ct')}</div>`}
function addStop(t){S.stops.push({type:t,place:t=='Personal pickup'||t=='Drop-off'?'Enter address':'Choose store near Great Neck',items:[],note:''});R()}
